# AuthSentry Configuration File

detection:
  threshold: 4          # Minimum failed attempts to trigger incident
  window_seconds: 120   # Sliding time window in seconds

log:
  file_path: "/var/log/auth.log"

mitigation:
  block_enabled: false  # Automatically apply firewall rules
  dry_run: true         # Simulate mitigation commands without execution

# Whitelist: IP addresses or subnets that will NEVER be blocked or alerted.
# NOTE: in a VirtualBox NAT lab the attacker appears as 10.0.2.2,
# so do not whitelist 10.0.0.0/8 while testing.
whitelist:
  - "127.0.0.1"
  - "192.168.1.105"     # Default gateway / router

telegram:
  enabled: false
  bot_token: ""
  chat_id: ""